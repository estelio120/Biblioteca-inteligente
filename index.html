<!DOCTYPE html>

<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca</title>
    <link rel="stylesheet" href="css/LOGIN.css">
</head>

<body>


<div class="login">

    <h1>LOGIN</h1>

    <p>
        Acesse sua conta para requisitar livros, acompanhar empréstimos e explorar o catálogo da biblioteca.
    </p>

    <form>

        <label for="email">
            <b>Email ou Número</b>
        </label>

        <input
            type="text"
            id="email"
            placeholder="stgevan@gmail.com"
            required>

        <label for="senha">
            <b>Senha</b>
        </label>
    
        <input
            type="password"
            id="senha"
            placeholder="******"
            required>

        <div class="op">

            <label class="lembrar">
                <input type="checkbox" required>
                Lembrar de mim
            </label>

            <a href="esqueciSenh.html " required>
                Esqueci minha senha
            </a>

        </div>

        <a href="INICIO.html">
            <button type="button">
                Entrar
            </button>
        </a>

    </form>

    <p class="registar">
        Ainda não tem conta?
        <a href="Pagina de cadastro.html">
            Criar conta
        </a>
    </p>

</div>


</body>

</html>

<!DOCTYPE html>

<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Biblioteca</title>
    <link rel="stylesheet" href="css/LOGIN.css">
</head>

<body>

<div class="login">

    <h1>LOGIN</h1>

    <p>
        Acesse sua conta para requisitar livros, acompanhar empréstimos e explorar o catálogo da biblioteca.
    </p>

    <form id="formLogin">

        <label for="nome">
            <b>Nome</b>
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Digite o seu nome"
            required>

        <label for="senha">
            <b>Senha</b>
        </label>

        <input
            type="password"
            id="senha"
            placeholder="******"
            required>

        <div class="op">

            <label class="lembrar">

                <input
                    type="checkbox"
                    id="lembrar">

                Lembrar de mim

            </label>

            <a href="esqueciSenh.html">
                Esqueci minha senha
            </a>

        </div>

        <button type="submit">
            Entrar
        </button>

    </form>

    <p class="registar">

        Ainda não tem conta?

        <a href="Pagina de cadastro.html">
            Criar conta
        </a>

    </p>

</div>

<script>

    document.getElementById("formLogin").addEventListener("submit", function(event) {

        event.preventDefault();

        const nomeDigitado = document.getElementById("nome").value.trim();
        const senhaDigitada = document.getElementById("senha").value;

        const dadosGuardados = localStorage.getItem("usuarioBiblioteca");

        if (!dadosGuardados) {
            alert("Nenhuma conta foi encontrada. Crie uma conta primeiro.");
            return;
        }

        const usuario = JSON.parse(dadosGuardados);

        if (
            nomeDigitado === usuario.nome &&
            senhaDigitada === usuario.senha
        ) {

            localStorage.setItem("usuarioLogado", "true");

            localStorage.setItem(
                "nomeUsuario",
                usuario.nome
            );

            alert("Login realizado com sucesso!");

            window.location.href = "INICIO.html";

        } else {

            alert("Nome ou senha incorretos!");

        }

    });

</script>

</body>

</html>

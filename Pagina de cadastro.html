<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/Pagina de cadastro.css">
</head>

<body>

    <div class="login">

        <h1>Criar conta</h1>

        <p>
            Faça o seu cadastro para acessar as principais funcionalidades da plataforma
        </p>

        <form id="formCadastro">

            <label for="nome">
                <b>Nome</b>
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite o seu nome"
                required>

            <label for="apelido">
                <b>Apelido</b>
            </label>

            <input
                type="text"
                id="apelido"
                placeholder="Digite o seu apelido"
                required>

            <label for="senha">
                <b>Senha</b>
            </label>

            <input
                type="password"
                id="senha"
                placeholder="********"
                required>

            <label for="confirmarSenha">
                <b>Confirmar senha</b>
            </label>

            <input
                type="password"
                id="confirmarSenha"
                placeholder="********"
                required>

            <br><br>

            <button type="submit">
                Criar conta
            </button>

        </form>

    </div>


    <div id="popup" class="popup">

        <div class="popup-conteudo">

            <div id="popupIcone" class="popup-icone">
                ✓
            </div>

            <h2 id="popupTitulo">
                Conta criada!
            </h2>

            <p id="popupMensagem">
                A sua conta foi criada com sucesso.
            </p>

            <button id="popupBotao">
                Ir para Login
            </button>

        </div>

    </div>


    <script>

        const formCadastro = document.getElementById("formCadastro");

        const popup = document.getElementById("popup");

        const popupIcone = document.getElementById("popupIcone");

        const popupTitulo = document.getElementById("popupTitulo");

        const popupMensagem = document.getElementById("popupMensagem");

        const popupBotao = document.getElementById("popupBotao");


        function abrirPopup(titulo, mensagem, tipo) {

            popupTitulo.textContent = titulo;

            popupMensagem.textContent = mensagem;

            popup.classList.add("ativo");

            if (tipo === "erro") {

                popupIcone.textContent = "!";

                popupIcone.classList.add("erro");

                popupBotao.textContent = "Tentar novamente";

            } else {

                popupIcone.textContent = "✓";

                popupIcone.classList.remove("erro");

                popupBotao.textContent = "Ir para Login";

            }

        }


        function fecharPopup() {

            popup.classList.remove("ativo");

        }


        formCadastro.addEventListener("submit", function(event) {

            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();

            const apelido = document.getElementById("apelido").value.trim();

            const senha = document.getElementById("senha").value;

            const confirmarSenha = document.getElementById("confirmarSenha").value;


            if (senha !== confirmarSenha) {

                abrirPopup(
                    "Senhas diferentes",
                    "As senhas que digitou não coincidem. Verifique e tente novamente.",
                    "erro"
                );

                return;

            }


            const usuario = {

                nome: nome,

                apelido: apelido,

                senha: senha

            };


            localStorage.setItem(
                "usuarioBiblioteca",
                JSON.stringify(usuario)
            );


            abrirPopup(
                "Conta criada!",
                "A sua conta foi criada com sucesso. Agora faça login para continuar.",
                "sucesso"
            );

        });


        popupBotao.addEventListener("click", function() {

            if (popupBotao.textContent === "Ir para Login") {

                window.location.href = "index.html";

            } else {

                fecharPopup();

            }

        });


        popup.addEventListener("click", function(event) {

            if (event.target === popup) {

                fecharPopup();

            }

        });

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/Pagina de cadastro.css">
</head>

<body>

    <div class="login">
        <h1>Criar conta</h1>
        <p>Faça o seu cadastro para acessar as principais funcionalidades da plataforma</p>

        <form action="INICIO.html" onsubmit="return validarSenha()">

            <label><b>Nome</b></label>
            <input type="text" placeholder="Digite o seu nome" required>

            <label><b>Apelido</b></label>
            <input type="text" placeholder="Digite o seu apelido" required>

            <label><b>Senha</b></label>
            <input type="password" id="senha" placeholder="********" required>

            <label><b>Confirmar senha</b></label>
            <input type="password" id="confirmarSenha" placeholder="********" required>

            <br><br>

            <button type="submit">Entrar</button>

        </form>
    </div>

    <script>
        function validarSenha() {
            let senha = document.getElementById("senha").value;
            let confirmarSenha = document.getElementById("confirmarSenha").value;

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return false; // impede o envio do formulário
            }

            return true; // permite entrar
        }
    </script>

</body>

</html>
